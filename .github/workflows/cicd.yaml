name: GitHub Actions Demo
run-name: GCP Deployment
on: 
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: 'actions/checkout@v7'

      - uses: 'google-github-actions/auth@v3'
        with:
            project_id: 'project-6a262d86-f7b2-46df-acd'
            workload_identity_provider: 'projects/1002319594061/locations/global/workloadIdentityPools/github/providers/my-repo'

      - name: test Gcloud
        run: |
          gcloud compute instances list
      